<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document chat · Course Allocation System</title>
  <link rel="stylesheet" href="rag-chat.css">
  <style>
    html, body { height: 100%; margin: 0; background: #E3E8EE; }
    #app { height: 100vh; padding: 16px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="rag-chat.js"></script>
  <script>
    // If you protect the API with a login dependency, return its header here.
    // Change 'access_token' to whatever key your frontend stores the JWT under.
    function getHeaders() {
      var token = localStorage.getItem('access_token') || localStorage.getItem('token');
      return token ? { Authorization: 'Bearer ' + token } : {};
    }
    RagChat.mount('#app', { apiBase: '/rag', getHeaders: getHeaders });
  </script>
</body>
</html>
